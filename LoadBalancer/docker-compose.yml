services:
  nginx:
    image: nginx:1.27-alpine
    container_name: edge-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - public_subnet
      - private_subnet
    depends_on:
      - backend

  backend:
    build: ./app
    expose:
      - "8000"
    networks:
      - private_subnet
    deploy:
      replicas: 2

networks:
  public_subnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
  private_subnet:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.20.0/24